name: Reportar un error
description: Algo de ERPNext RD no funciona como debería
labels: ["error"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportarlo. **No adjunte certificados (.p12), contraseñas, tokens ni datos reales de clientes o empleados**: este repositorio es público.
  - type: textarea
    id: que_paso
    attributes:
      label: Qué pasó
      description: Qué esperaba y qué hizo la app. Copie el mensaje de error si salió uno.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Ir a ...
        2. Crear una factura con ...
        3. Ver el error
    validations:
      required: true
  - type: dropdown
    id: modulo
    attributes:
      label: Módulo
      options:
        - NCF y comprobantes fiscales
        - e-CF (facturación electrónica)
        - Reportes DGII (606, 607, 608, 609, IT-1, IR-17)
        - Padrón RNC
        - Panel de cumplimiento
        - Nómina RD
        - Instalación o actualización
        - Otro
    validations:
      required: true
  - type: input
    id: versiones
    attributes:
      label: Versiones
      description: De Frappe, ERPNext, Frappe HR y ERPNext RD (en Ayuda → Acerca de).
      placeholder: "Frappe v16.52.0, ERPNext v16.51.1, Frappe HR v16.51.0, ERPNext RD 0.3.0"
    validations:
      required: true
  - type: dropdown
    id: donde
    attributes:
      label: Dónde está instalado
      options:
        - Frappe Cloud
        - Docker
        - Bench
