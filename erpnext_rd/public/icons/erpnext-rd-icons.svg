<!-- Ícono de dos tonos de ERPNext RD para el dock y el encabezado del sidebar de RD Compliance.
     Sigue el estilo de los íconos de módulo de ERPNext (erpnext/public/icons/module-icons.svg):
     cuadrícula de 24 x 24, tono oscuro (--duotone-dark) y tono claro (--duotone-light), y una
     animación que solo corre mientras el dock pasa --icon-motion al tener el mouse encima. -->

<svg id="erpnext-rd-module-symbols" aria-hidden="true" style="display: none;" class="icon" xmlns="http://www.w3.org/2000/svg">
	<style>
		/* RD Compliance: el sello de cumplimiento se estampa sobre el comprobante. */
		.rd-compliance-sello {
			transform-box: fill-box;
			transform-origin: center;
			animation: rd-compliance-estampar 1.6s ease-out infinite;
			animation-play-state: var(--icon-motion, paused);
		}
		@keyframes rd-compliance-estampar {
			0%, 100% { transform: scale(1); }
			20% { transform: scale(1.18) translate(0.3px, -0.3px); }
			35% { transform: scale(0.95); }
			50% { transform: scale(1); }
		}
		@media (prefers-reduced-motion: reduce) {
			.rd-compliance-sello { animation: none; }
		}
	</style>

	<!-- RD Compliance: comprobante fiscal con escudo de cumplimiento DGII -->
	<symbol viewBox="0 0 24 24" id="icon-rd-compliance-duotone" stroke="none" style="overflow: visible">
		<path fill-rule="evenodd" d="M6.4 2.5H15.6Q17 2.5 17 3.9V10.3L12.2 12.1V19.9L12 19.4L10.6 20.8L9.2 19.4L7.8 20.8L6.4 19.4L5 20.8V3.9Q5 2.5 6.4 2.5ZM7.9 6.65H14.1A0.75 0.75 0 0 0 14.1 5.15H7.9A0.75 0.75 0 0 0 7.9 6.65ZM7.9 9.85H12.6A0.75 0.75 0 0 0 12.6 8.35H7.9A0.75 0.75 0 0 0 7.9 9.85ZM7.9 13.05H10.4A0.75 0.75 0 0 0 10.4 11.55H7.9A0.75 0.75 0 0 0 7.9 13.05Z" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<g class="rd-compliance-sello">
			<path d="M17.6 11.2L22.2 12.9V16.6Q22.2 20.4 17.6 22.6Q13 20.4 13 16.6V12.9Z" style="fill: var(--duotone-light, var(--ink-gray-3))" />
			<path d="M15.2 16.8L16.2 15.8L17.1 16.7L19.2 14.6L20.2 15.6L17.1 18.7Z" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		</g>
	</symbol>
</svg>
