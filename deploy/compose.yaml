# Stack ERPNext + HRMS + erpnext_rd (basado en frappe_docker/pwd.yml).
# Local:   docker compose -f deploy/compose.yaml --env-file deploy/.env up -d --build
# Una sola instancia: un sitio ($SITE_NAME) = una base de datos MariaDB con las 3 apps.

x-erpnext: &erpnext
  image: ${ERPNEXT_IMAGE:-erpnext-rd}:${ERPNEXT_IMAGE_TAG:-local}
  restart: unless-stopped
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs

x-redis-env: &redis-env
  FRAPPE_REDIS_CACHE: redis://redis-cache:6379
  FRAPPE_REDIS_QUEUE: redis://redis-queue:6379

x-after-configurator: &after-configurator
  depends_on:
    configurator:
      condition: service_completed_successfully

services:
  configurator:
    <<: *erpnext
    build:
      context: ..
      dockerfile: deploy/Containerfile
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"

  # Crea el sitio la primera vez; en los siguientes arranques corre migrate
  # (aplica cambios de version de ERPNext/HRMS y de erpnext_rd).
  create-site:
    <<: [*erpnext, *after-configurator]
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        if [ -d "sites/$$SITE_NAME" ]; then
          echo "Sitio $$SITE_NAME existe: migrate";
          bench --site $$SITE_NAME migrate;
        else
          bench new-site $$SITE_NAME --mariadb-user-host-login-scope='%' --admin-password=$$ADMIN_PASSWORD --db-root-username=root --db-root-password=$$DB_ROOT_PASSWORD --install-app erpnext --install-app hrms --install-app erpnext_rd --set-default;
        fi;
    environment:
      SITE_NAME: ${SITE_NAME:-erp.localhost}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD requerido}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD requerido}
    depends_on:
      configurator:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  backend:
    <<: [*erpnext, *after-configurator]

  frontend:
    <<: *erpnext
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:-erp.localhost}
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    depends_on:
      - backend
      - websocket
    ports:
      - "${HTTP_PUBLISH_PORT:-8080}:8080"

  websocket:
    <<: [*erpnext, *after-configurator]
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    environment: *redis-env

  queue-short:
    <<: [*erpnext, *after-configurator]
    command: ["bench", "worker", "--queue", "short,default"]
    environment: *redis-env

  queue-long:
    <<: [*erpnext, *after-configurator]
    command: ["bench", "worker", "--queue", "long,default,short"]
    environment: *redis-env

  scheduler:
    <<: [*erpnext, *after-configurator]
    command: ["bench", "schedule"]

  db:
    image: mariadb:11.8
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 5
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD requerido}
    volumes:
      - db-data:/var/lib/mysql

  redis-queue:
    image: redis:6.2-alpine
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

  redis-cache:
    image: redis:6.2-alpine
    restart: unless-stopped

volumes:
  db-data:
  redis-queue-data:
  sites:
  logs:
